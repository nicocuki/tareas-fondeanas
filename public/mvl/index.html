<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mario vs Luigi · Tareas Fondeanas</title>
    <link rel="icon" href="TemplateData/webmemd-icon.png">
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #fff; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; }
      #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0b0f1a; }
      #carga p { margin: 0; font-size: 15px; opacity: 0.85; }
      #barra { width: min(360px, 70vw); height: 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.15); overflow: hidden; }
      #barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #e3342f, #3fae49); transition: width 0.2s; }
      #error { color: #ff9a8a; max-width: 480px; text-align: center; }
    </style>
  </head>
  <body>
    <!-- Compilación web (WebGL) de NSMB Mario vs Luigi de ipodtouch0218 y colaboradores:
         https://github.com/ipodtouch0218/NSMB-MarioVsLuigi -->
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="carga"><p id="texto">Cargando Mario vs Luigi…</p><div id="barra"><i></i></div><p id="error" hidden></p></div>
    <script>
      // En el cole bloquean los servidores de Photon (y quizás el de ipodtouch en Azure), pero
      // Cloudflare abre. Antes de que arranque Unity, las conexiones a esos servidores se desvían a
      // este mismo sitio (/api/photon/…, /api/mvl/…), y el Worker las reenvía (worker/photon.js).
      // Además se usa nuestra app de Photon Quantum 3 (NEW_APP) en vez de la de ipodtouch que trae la
      // compilación (OLD_APP): el App ID viaja en texto en los primeros mensajes de cada conexión y se
      // reemplaza ahí (mide lo mismo, 36 letras). Nuestra app tiene en el panel de Photon la
      // autenticación personalizada apuntando a https://tareas-fondeanas.nicocukier.workers.dev/api/photon-auth:
      // el juego siempre pide autenticación «Custom» y una app sin ninguna configurada lo rechaza.
      // Para volver a la de ipodtouch alcanza con poner NEW_APP = OLD_APP.
      (() => {
        const OLD_APP = '6b4b72d0-57c3-4991-96c1-f3f36f9548e5';
        const NEW_APP = '097c581c-ecbd-4e89-abfb-f988ad06ec5b';
        const PHOTON = /(^|\.)(photonengine\.io|exitgames\.com)$/i;
        const MVL = 'mariovsluigi.azurewebsites.net';
        const wsBase = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/photon/`;

        const viaPhoton = (raw) => {
          const u = new URL(raw);
          if (!PHOTON.test(u.hostname)) return raw;
          return wsBase + u.host + u.pathname + u.search.replace(`app=${OLD_APP.slice(0, 8)}`, `app=${NEW_APP.slice(0, 8)}`);
        };
        const viaMvl = (raw) => {
          try {
            const u = new URL(raw, location.href);
            return u.hostname === MVL ? `${location.origin}/api/mvl${u.pathname}${u.search}` : raw;
          } catch { return raw; }
        };

        const oldBytes = new TextEncoder().encode(OLD_APP);
        const newBytes = new TextEncoder().encode(NEW_APP);
        // Devuelve una copia con el App ID cambiado, o null si no estaba (lo que manda Unity es una
        // vista de su propia memoria: no se toca).
        const swapAppId = (bytes) => {
          let out = null;
          for (let i = 0; i + oldBytes.length <= bytes.length; i++) {
            if (bytes[i] !== oldBytes[0]) continue;
            let j = 1;
            while (j < oldBytes.length && bytes[i + j] === oldBytes[j]) j++;
            if (j === oldBytes.length) { out ??= bytes.slice(); out.set(newBytes, i); i += j - 1; }
          }
          return out;
        };

        const NativeWebSocket = window.WebSocket;
        window.WebSocket = new Proxy(NativeWebSocket, {
          construct(Target, [url, protocols]) {
            const socket = protocols === undefined ? new Target(viaPhoton(String(url))) : new Target(viaPhoton(String(url)), protocols);
            let checked = 0; // la autenticación va en los primeros mensajes; después no se revisa más
            const send = socket.send;
            socket.send = function (data) {
              if (NEW_APP !== OLD_APP && checked < 40 && data && typeof data !== 'string') {
                checked++;
                const view = data instanceof ArrayBuffer ? new Uint8Array(data) : new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
                const swapped = swapAppId(view);
                if (swapped) return send.call(this, swapped);
              }
              return send.call(this, data);
            };
            return socket;
          },
        });

        // Solo se tocan los pedidos a Azure; todo lo demás (los archivos del juego) pasa intacto.
        const nativeFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
          const url = input instanceof Request ? input.url : String(input);
          const via = viaMvl(url);
          if (via === url) return nativeFetch(input, init);
          return nativeFetch(input instanceof Request ? new Request(via, input) : via, init);
        };
        const open = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) { return open.call(this, method, viaMvl(String(url)), ...rest); };
      })();
    </script>
    <script src="Build/web-mvl.loader.js"></script>
    <script>
      // Cloudflare acepta archivos de hasta 25 MB, y el de datos pesa 43: está partido en dos
      // (`.part0`, `.part1`) y acá se vuelve a juntar en el navegador antes de pasárselo a Unity.
      const PARTS = ['Build/web-mvl.data.unityweb.part0', 'Build/web-mvl.data.unityweb.part1'];
      const bar = document.querySelector('#barra i');
      const show = (pct) => { bar.style.width = `${Math.round(pct * 100)}%`; };

      async function loadParts() {
        const sizes = new Array(PARTS.length).fill(0);
        const done = new Array(PARTS.length).fill(0);
        const chunks = await Promise.all(PARTS.map(async (url, i) => {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`No se pudo bajar ${url} (${res.status})`);
          sizes[i] = Number(res.headers.get('content-length')) || 22000000;
          const reader = res.body.getReader();
          const parts = [];
          for (;;) {
            const { value, done: end } = await reader.read();
            if (end) break;
            parts.push(value);
            done[i] += value.length;
            show((0.6 * done.reduce((a, b) => a + b, 0)) / sizes.reduce((a, b) => a + b, 0));
          }
          return new Blob(parts);
        }));
        return URL.createObjectURL(new Blob(chunks));
      }

      loadParts().then((dataUrl) => createUnityInstance(document.querySelector('#unity-canvas'), {
        arguments: [],
        dataUrl,
        frameworkUrl: 'Build/web-mvl.framework.js.unityweb',
        codeUrl: 'Build/web-mvl.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'ipodtouch0218',
        productName: 'NSMB-MarioVsLuigi',
        productVersion: '2.2.0.1',
      }, (p) => show(0.6 + 0.4 * p))).then(() => {
        document.querySelector('#carga').remove();
        document.querySelector('#unity-canvas').focus();
      }).catch((e) => {
        document.querySelector('#texto').textContent = 'No se pudo abrir el juego.';
        const err = document.querySelector('#error');
        err.hidden = false;
        err.textContent = String(e?.message || e);
      });
    </script>
  </body>
</html>
