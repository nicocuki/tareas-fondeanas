<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f13" />
    <meta name="description" content="Tareas Fondeanas: juegos multijugador para jugar online con amigos, cada uno desde su pantalla. Trazo Loco, Código Secreto, Café o Té y Fútbol." />
    <title>Tareas Fondeanas · juegos para jugar con amigos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='11' fill='%23ffd23f'/><path d='M9 20.5 30 11l-6.5 19-4.2-6.6L9 20.5Z' fill='%2317140a'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Lilita+One&family=Nunito:wght@700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" />
    <script>
      // Antes de pintar: tema guardado (evita el destello del tema equivocado).
      try {
        var p = JSON.parse(localStorage.getItem('tf:preferencias') || '{}');
        var light = p.theme === 'light' || ((!p.theme || p.theme === 'system') && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
